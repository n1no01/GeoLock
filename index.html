<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoLock</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header>
  <h1>GeoLock</h1>
  <div class="header-right">
    <div class="nav-tabs">
      <button id="tabMapBtn" class="tab-btn active">Mapa</button>
      <button id="tabListBtn" class="tab-btn">Lista (<span id="tab-count">0</span>)</button>
    </div>
    
    <!-- DUGME/STATUS ZA BIOMETRIJU U HEADERU -->
    <div id="bioHeaderContainer" style="display: none;">
      <button id="enableBioHeaderBtn" class="auth-btn" style="background: #334155; border: 1px solid #475569; font-size: 11px;">
        👆 Omogući Biometriju
      </button>
    </div>

    <span id="syncStatus" class="sync-status">🔒 Lokalni rad</span>
    <button id="authBtn" class="auth-btn">Prijava</button>
  </div>
</header>

<main>
  <!-- TAB 1: MAPA I UNOS -->
  <div id="map-view" class="tab-content active" style="position: relative;">
    <div id="map"></div>
    
    <!-- LEBDEĆI ALATI NA MAPI (Zasebno od headera, idealno za mobilne uređaje) -->
    <div class="map-floating-tools">
      <button type="button" id="toggleMeasureBtn" class="map-tool-btn" title="Mjeri distancu/površinu">
        📏 Mjeri
      </button>
    </div>
    
    <div id="sidebar-add">
      <button type="button" id="gpsBtn" class="btn btn-gps">
        <span>📍 Očitaj trenutnu GPS lokaciju</span>
      </button>
      <div id="gpsStatus" class="gps-status"></div>

      <form id="locationForm">
        <div style="display: flex; gap: 6px;">
          <div class="form-group" style="flex:1;">
            <label>Lat (Širina):</label>
            <input type="number" step="any" id="lat" required placeholder="44.538">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Lng (Dužina):</label>
            <input type="number" step="any" id="lng" required placeholder="18.667">
          </div>
        </div>
        <div class="form-group">
          <label>MGRS Oznaka:</label>
          <input type="text" id="mgrsInput" placeholder="npr. 34T CJ 12345 67890">
        </div>
        <div class="form-group">
          <label>Naziv / Oznaka:</label>
          <input type="text" id="title" required placeholder="npr. Lokacija Teren 1">
        </div>
        <div class="form-group">
          <label>Opis i bilješke:</label>
          <textarea id="description" rows="2" placeholder="Pristupni put, stanje na terenu, zabilješke..."></textarea>
        </div>

        <div class="audio-recorder">
          <label style="font-size:11px; font-weight:600; color:#475569;">Glasovna bilješka:</label>
          <div class="audio-ctrls">
            <button type="button" id="recordBtn" class="btn btn-record">
              <span>🎙️ Snimi glasovnu bilješku</span>
            </button>
          </div>
          <div id="recordTimer" style="font-size: 11px; color: #dc2626; font-weight: bold; text-align: center; display: none;">Snimanje u toku: <span id="timerVal">00:00</span></div>
          <audio id="audioPreview" class="audio-preview" controls style="display: none;"></audio>
        </div>

        <div class="form-group">
          <label>Fotografije s terena:</label>
          <input type="file" id="imageInput" accept="image/*" multiple>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sačuvaj Lokaciju</button>
      </form>
    </div>
  </div>

  <!-- TAB 2: DETALJNA LISTA -->
  <div id="list-view" class="tab-content">
    <div class="controls-bar">
      <input type="text" id="searchInput" placeholder="Pretraži unose..." style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
      <div style="display: flex; gap: 6px;">
        <select id="sortSelect" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; flex: 1;">
          <option value="newest">Najnovije</option>
          <option value="oldest">Najstarije</option>
          <option value="title_asc">Naziv (A-Z)</option>
        </select>
        <button id="exportGeoJsonBtn" class="btn btn-secondary" style="padding: 6px 10px;">GeoJSON</button>
        <button id="exportCsvBtn" class="btn btn-secondary" style="padding: 6px 10px;">CSV</button>
      </div>
    </div>

    <div id="gridContainer" class="grid-container"></div>
  </div>
</main>

<!-- MODAL ZA DETALJE -->
<div id="detailsModal" class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Naziv Lokacije</h2>
      <button class="close-btn" onclick="document.getElementById('detailsModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-body">
      <div style="background:#f1f5f9; padding:6px 10px; border-radius:6px; font-family:monospace; font-size:12px; margin-bottom:10px;" id="modalCoords"></div>
      <div style="font-size:13px; line-height:1.5; margin-bottom:15px; white-space:pre-wrap;" id="modalDesc"></div>
      
      <div id="modalAudioContainer" style="margin-bottom: 15px; display: none; background:#f8fafc; padding:10px; border-radius:6px; border:1px solid #e2e8f0;">
        <h4 style="margin: 0 0 6px 0; font-size:13px; color:#475569;">🔊 Glasovna bilješka:</h4>
        <audio id="modalAudioPlayer" controls style="width: 100%;"></audio>
      </div>

      <h4 style="margin: 10px 0 6px 0; font-size:13px; color:#475569;">Slike (<span id="modalImageCount">0</span>):</h4>
      <div class="modal-gallery" id="modalGallery"></div>
      
      <div style="margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;">
        <button id="modalEditBtn" class="btn btn-warning" style="flex:1;">Uredi</button>
        <button id="modalMapBtn" class="btn" style="flex:1;">Mapa</button>
        <button id="modalDeleteBtn" class="btn btn-danger" style="flex:1;">Obriši</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL ZA EDIT -->
<div id="editModal" class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Uredi Lokaciju</h2>
      <button class="close-btn" onclick="document.getElementById('editModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editForm">
        <input type="hidden" id="editId">
        <div style="display: flex; gap: 6px;">
          <div class="form-group" style="flex:1;"><label>Lat:</label><input type="number" step="any" id="editLat" required></div>
          <div class="form-group" style="flex:1;"><label>Lng:</label><input type="number" step="any" id="editLng" required></div>
        </div>
        
        <!-- MGRS POLJE U MODALU ZA UREĐIVANJE -->
        <div class="form-group">
          <label>MGRS Oznaka:</label>
          <input type="text" id="editMgrsInput" placeholder="npr. 34T CJ 12345 67890">
        </div>

        <div class="form-group"><label>Naziv:</label><input type="text" id="editTitle" required></div>
        <div class="form-group"><label>Opis:</label><textarea id="editDescription" rows="3"></textarea></div>
        <div class="form-group"><label>Slike:</label><div id="editExistingGallery" class="modal-gallery"></div></div>
        <div class="form-group"><label>Dodaj nove slike:</label><input type="file" id="editNewImages" accept="image/*" multiple></div>
        <div style="margin-top: 15px; display: flex; gap: 8px;">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('editModal').classList.remove('open')" style="flex:1;">Odustani</button>
          <button type="submit" class="btn" style="flex:1;">Sačuvaj</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL ZA PRIJAVU I BIOMETRIJU -->
<div id="authModal" class="modal-backdrop">
  <div class="modal-content" style="max-width: 380px;">
    <div class="modal-header">
      <h2 id="authTitle">Korisnička Prijava</h2>
    </div>
    <div class="modal-body">
      <div id="bioFastLoginContainer" style="display: none; margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0;">
        <button type="button" id="biometricsBtn" class="btn" style="width: 100%; background: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px;">
          <span>👆 Brza Prijava (Otisak / FaceID)</span>
        </button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label>Email adresa:</label>
          <input type="email" id="authEmail" required placeholder="korisnik@email.com">
        </div>
        <div class="form-group">
          <label>Lozinka:</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
          <input type="checkbox" id="rememberMe" checked style="width: auto; cursor: pointer;">
          <label for="rememberMe" style="font-size: 12px; cursor: pointer; margin: 0; color: #475569;">Zapamti me na ovom uređaju</label>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn" style="width: 100%; margin-top: 10px;">Prijavi se</button>
      </form>

      <div style="margin-top: 12px; text-align: center;">
        <a href="#" id="toggleAuthMode" style="font-size: 12px; color: #2563eb;">Nemate račun? Registrujte se</a>
      </div>
    </div>
  </div>
</div>

<div id="toastNotification" class="toast-notification"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
